<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#182027" />
    <title>BoatBoard Editor</title>
    <link rel="stylesheet" href="styles.css?v=boatboard-20260814-149" />
  </head>
  <body class="editor-page">
    <main class="board" aria-label="BoatBoard organization editor">
      <div class="ocean-glow ocean-glow-one"></div>
      <div class="ocean-glow ocean-glow-two"></div>
      <canvas class="organization-canvas" aria-label="Teams and colleagues"></canvas>
      <header class="brand">
        <span class="brand-company"></span>
        <small>Boat Board Editor</small>
      </header>
      <section class="viewer-search" aria-label="Find a colleague">
        <button class="viewer-search-toggle" type="button" aria-label="Search colleagues" aria-expanded="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="4.75" /><path d="m12 12 4 4" /></svg>
        </button>
        <div class="viewer-search-panel" aria-hidden="true">
          <header class="viewer-search-header">
            <label class="viewer-search-field">
              <input type="search" autocomplete="off" spellcheck="false" aria-label="Search colegazz e equipezz" placeholder="Search colegazz e equipezz" />
            </label>
            <button class="viewer-search-close" type="button" aria-label="Close search">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8" /></svg>
            </button>
          </header>
          <div class="viewer-search-results" role="list"></div>
        </div>
      </section>
    </main>
    <section class="editor-directory">
      <button class="editor-directory-toggle" type="button" aria-label="Open editor panel" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 14.75.75-3.25L13 3.25l3.25 3.25L8 14.75zM11.5 4.75l3.25 3.25" /></svg>
      </button>
      <aside class="editor-panel" aria-label="Board editor" aria-hidden="true">
        <header class="data-main-header">
          <div class="data-header-actions">
            <button class="data-add-team data-icon-button" type="button" aria-label="Add team" title="Add team">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg>
            </button>
            <button class="data-choose-workbook data-icon-button" type="button" aria-label="Import workbook" title="Import workbook">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9M6.5 8.5 10 12l3.5-3.5M4 15.5h12" /></svg>
            </button>
            <button class="data-open-folder data-icon-button" type="button" aria-label="Open instance folder" title="Open instance folder">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.75 5.5h5l1.5 2h7v8.75H2.75z" /></svg>
            </button>
            <button class="data-close data-icon-button" type="button" aria-label="Close" title="Close">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8" /></svg>
            </button>
            <input class="data-workbook-input" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
          </div>
        </header>
        <div class="data-section-divider"></div>
        <section class="data-team-directory"><div class="data-teams"></div></section>
        <span class="data-status" aria-live="polite"></span>
      </aside>
    </section>
    <aside class="profile-popup" aria-hidden="true" aria-label="Colleague information">
      <button class="profile-popup-close" type="button" aria-label="Close colleague information">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8" /></svg>
      </button>
      <div class="profile-popup-content"></div>
    </aside>
    <aside class="team-popup" aria-hidden="true" aria-label="Team information">
      <button class="team-popup-close" type="button" aria-label="Close team information">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8" /></svg>
      </button>
      <div class="team-popup-content"></div>
    </aside>
    <script type="module" src="app.js?v=boatboard-20260814-148"></script>
    <script type="module" src="viewer-search.js?v=boatboard-20260814-148"></script>
    <script type="module" src="data-editor.js?v=boatboard-20260814-148"></script>
    <script type="module" src="profile-popup.js?v=boatboard-20260814-148"></script>
    <script type="module" src="team-popup.js?v=boatboard-20260814-148"></script>
  </body>
</html>
