<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#182027" />
    <title>BoatBoard Editor - Eduzz</title>
    <link rel="stylesheet" href="styles.css?v=boatboard-20260811-108" />
  </head>
  <body class="editor-mode">
    <main class="board" aria-label="BoatBoard organization editor">
      <canvas class="organization-canvas" aria-label="Editable teams and colleagues"></canvas>
      <header class="brand">
        <span class="brand-company"></span>
        <small>Boat Board Editor</small>
      </header>
    </main>
    <aside class="editor-panel" aria-label="Unplaced teams">
      <div class="editor-panel-heading">
        <strong>Teams</strong>
        <div class="panel-actions">
          <button class="data-open" type="button" aria-label="Open Board Data">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h7l3 3v11H5z" /><path d="M12 3v3h3" /></svg>
          </button>
          <button class="panel-toggle" type="button" aria-label="Hide teams panel" aria-expanded="true">
            <svg class="panel-arrow-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m5.75 7.5 4.25 4.25 4.25-4.25" /></svg>
            <svg class="panel-menu-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.75h12M4 10h12M4 14.25h12" /></svg>
          </button>
        </div>
      </div>
      <div class="unplaced-list"></div>
    </aside>
    <dialog class="data-editor" tabindex="-1">
      <form class="data-editor-form">
        <header class="data-main-header">
          <input class="board-company-input" name="companyName" aria-label="Company name" placeholder="Company name" required />
          <div class="data-header-actions">
            <button class="data-add-team data-icon-button" type="button" aria-label="Add team" title="Add team">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg>
            </button>
            <button class="data-choose-workbook data-icon-button" type="button" aria-label="Import workbook" title="Import workbook">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9M6.5 8.5 10 12l3.5-3.5M4 15.5h12" /></svg>
            </button>
            <button class="data-open-folder data-icon-button" type="button" aria-label="Open instance folder" title="Open instance folder">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.75 5.5h5l1.5 2h7v8.75H2.75z" /></svg>
            </button>
            <button class="data-close data-icon-button" type="button" aria-label="Close" title="Close">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8" /></svg>
            </button>
            <input class="data-workbook-input" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
          </div>
        </header>
        <section class="data-team-directory"><div class="data-teams"></div></section>
        <span class="data-status" aria-live="polite"></span>
      </form>
    </dialog>
    <script type="module" src="app.js?v=boatboard-20260811-106"></script>
    <script type="module" src="data-editor.js?v=boatboard-20260809-62"></script>
  </body>
</html>
